[pytest]
; 四个市场/组合程序各有一组测试, 加上共享层与启动器, 共六个根。
; --import-mode=importlib: 各程序目录下存在同名测试文件(如 stock_market_A/tests/test_engine.py
; 与 stock_market_HK/tests/test_engine.py), 传统的 prepend 模式会按 basename 生成模块名而相撞,
; importlib 模式用「相对 rootdir 的路径」生成模块名, 天然唯一, 也无需 __init__.py。
testpaths =
    tools/tests
    common/tests
    stock_market_A/tests
    stock_market_HK/tests
    stock_market_USA/tests
    stock_market_GLOBAL/tests
addopts = --import-mode=importlib
